name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every test runs against committed fixtures; the setup file fails any test
  # that reaches the network. Nothing here needs a key or an outbound request.
  CI: 'true'

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: No secrets in the client bundle
        # The Anthropic key is server-only. If it ever reaches .next/static the
        # assistant has leaked a paid credential to every visitor, so this is a
        # build-breaking check rather than a review habit.
        run: |
          if grep -rIl --exclude-dir=cache -E 'sk-ant-|ANTHROPIC_API_KEY' .next/static 2>/dev/null; then
            echo "::error::A secret or its env var name reached the client bundle."
            exit 1
          fi
          echo "Client bundle is clean."

  postgres:
    name: Repository contract on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dealscanada_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Migrate and run the contract suite against Postgres
        # NFR-2 claims swapping SQLite for Postgres is DATABASE_URL and nothing
        # else. This job is what makes that claim true rather than aspirational.
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/dealscanada_test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/dealscanada_test
        run: |
          npm run db:migrate
          npx vitest run tests/db
